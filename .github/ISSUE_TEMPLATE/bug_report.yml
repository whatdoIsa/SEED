name: 버그 리포트
description: 동작이 기대와 다른 경우
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 현상
      description: 무엇이 잘못 동작하는가
      placeholder: 매도 주문 시트에서 전부 버튼을 누르면...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
      placeholder: |
        1. 시장 탭에서 한빛전자 진입
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 환경
      placeholder: iPhone 15 Pro / iOS 26.5 / 앱 1.0 (6)
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 추가 정보
      description: 스크린샷, 로그 등
