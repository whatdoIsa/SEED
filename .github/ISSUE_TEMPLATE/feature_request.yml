name: 기능 제안
description: 새 기능 또는 개선 제안
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 사용자 관점에서 어떤 문제가 있는가
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안
      description: 어떻게 풀 것인가. 화면 흐름이나 동작을 구체적으로.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 범위 밖 (하지 않을 것)
      description: 이번 작업에서 의도적으로 제외하는 것
  - type: checkboxes
    id: guardrail
    attributes:
      label: 원칙 확인
      options:
        - label: 종목 추천, 가격 예측, 수익 보장에 해당하지 않는다 (§11)
          required: true
